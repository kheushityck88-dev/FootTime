<!doctype html><html lang="fr"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0B0F0E"><title>FootTime — Espace terrain</title>
<style>
:root{--g:#16A34A;--gd:#0F6B38;--k:#0B0F0E;--c:#F7F8F5;--gr:#9CA3AF;--bd:#e5e7eb}
*{box-sizing:border-box;margin:0}body{font-family:system-ui,sans-serif;background:var(--c);color:var(--k);padding-bottom:40px}
header{background:var(--k);padding:10px 16px}header img{height:44px;display:block}main{padding:16px;max-width:760px;margin:auto}
h2{margin:4px 0 8px;font-size:22px}.muted,small{color:#6b7280;font-size:13px}
.card{background:#fff;border:1px solid var(--bd);border-radius:14px;margin:14px 0;padding:14px;box-shadow:0 1px 3px rgba(0,0,0,.05)}
select,input{width:100%;padding:12px;border:1px solid #d1d5db;border-radius:10px;margin:6px 0;font-size:16px;background:#fff}
.btn{background:var(--g);color:#fff;border:0;border-radius:10px;padding:14px;width:100%;font-size:16px;font-weight:600;margin-top:8px}
.adm{background:#fef3c7;color:#92400e;border-radius:12px;padding:12px 14px;margin-bottom:12px;font-size:14px}.adm a{color:var(--gd);font-weight:600}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:13px;color:#4b5563;margin:8px 0}.legend span{display:flex;align-items:center;gap:6px}
.legend i{width:14px;height:14px;border-radius:4px;display:inline-block}
.lf{background:#ecfdf3;border:1.5px solid #86efac}.lb{background:var(--g)}.lw{background:#fbbf24}.ld{background:var(--k)}.lp{background:#e5e7eb}
.nav{display:flex;align-items:center;gap:8px;margin:10px 0}.nav b{flex:1;text-align:center;text-transform:capitalize;font-size:16px}
.nav button{border:1px solid var(--bd);background:#fff;border-radius:10px;padding:10px 14px;font-size:15px;cursor:pointer}
.wk{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.dy{border:1px solid var(--bd);background:#fff;border-radius:12px;padding:8px 2px;display:grid;gap:3px;justify-items:center;cursor:pointer}
.dy b{font-size:17px}.dy small{font-size:11px;text-transform:capitalize}.dy.on{background:var(--k);color:#fff;border-color:var(--k)}.dy.on small{color:#cbd5d1}
.dy.td b{color:var(--g)}.dy.on.td b{color:#4ade80}
.bar{width:70%;height:5px;border-radius:3px;background:#e5e7eb;overflow:hidden;display:block}.bar i{display:block;height:100%;background:var(--g)}
.tl{display:grid;grid-template-columns:50px 1fr;grid-auto-rows:66px;gap:6px 10px;margin:14px 0}
.hl{grid-column:1;font-size:13px;color:#6b7280;padding-top:8px;font-weight:600}
.fr{grid-column:2;border-radius:12px;background:#ecfdf3;border:1.5px solid #86efac;color:var(--gd);font-weight:600;display:flex;align-items:center;padding:0 14px;font-size:14px}
.fr.ps{background:#f3f4f6;border-color:#e5e7eb;color:var(--gr)}
.ev{grid-column:2;border-radius:12px;padding:10px 14px;display:grid;gap:2px;align-content:center;background:var(--g);color:#fff;font-size:13px;overflow:hidden}
.ev b{font-size:15px}.ev.wt{background:#fbbf24;color:#451a03}.ev.dn{background:var(--k)}.ev a{color:inherit}
.kp{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}.kp div{display:grid;gap:2px}.kp b{font-size:22px;color:var(--gd)}
.row{display:flex;justify-content:space-between;gap:10px;padding:9px 0;border-bottom:1px solid #eef0ee;font-size:14px}.row:last-child{border:0}
</style></head><body>
<header><img src="assets/logo.png" alt="FootTime"></header><main id="app"></main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="config.js"></script>
<script>
const sb=supabase.createClient(SUPABASE_URL,SUPABASE_ANON_KEY),$=s=>document.querySelector(s),app=$('#app');
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fcfa=n=>Number(n||0).toLocaleString('fr-FR')+' FCFA',hh=h=>String(h%24).padStart(2,'0')+'h';
const dstr=d=>d.toISOString().slice(0,10),addD=(s,n)=>dstr(new Date(new Date(s+'T00:00:00Z').getTime()+n*864e5));
const weekStart=s=>addD(s,-((new Date(s+'T00:00:00Z').getUTCDay()+6)%7));
let PITCHES=[],DAY=dstr(new Date());

async function init(){
 const{data:{session}}=await sb.auth.getSession();if(!session)return login();
 const uid=session.user.id;
 const{data:me}=await sb.from('profiles').select('role').eq('id',uid).single();const adm=me?.role==='ADMIN_FOOTTIME';
 const{data:ow}=await sb.from('owners').select('id').eq('user_id',uid);
 const{data:pm}=await sb.from('pitch_managers').select('pitch_id').eq('user_id',uid).eq('status','actif');
 const oids=(ow||[]).map(o=>o.id),pids=(pm||[]).map(m=>m.pitch_id);
 const{data:all}=await sb.from('pitches').select('id,name,owner_id,opening_time,closing_time');
 PITCHES=(all||[]).filter(p=>adm||oids.includes(p.owner_id)||pids.includes(p.id));
 if(!PITCHES.length)return app.innerHTML="<h2>Espace terrain</h2><p class='muted'>Aucun terrain n'est rattaché à ce compte.</p>";
 app.innerHTML=`${adm?'<div class="adm"><b>Vue administrateur</b><br>Tu vois exactement ce que voit le propriétaire de ce terrain. <a href="admin.html">← Retour à l\'administration</a></div>':''}
 <h2 id="pt"></h2><select id="p" ${PITCHES.length>1?'':'hidden'}>${PITCHES.map(p=>`<option value="${p.id}">${esc(p.name)}</option>`).join('')}</select>
 <div class="nav"><button id="pv">◀</button><b id="dl"></b><button id="nx">▶</button><button id="td">Aujourd'hui</button></div>
 <div id="wk" class="wk"></div>
 <div class="legend"><span><i class="lf"></i>Libre</span><span><i class="lb"></i>Réservé</span><span><i class="lw"></i>Paiement en attente</span><span><i class="ld"></i>Match terminé</span><span><i class="lp"></i>Heure passée</span></div>
 <p id="nt" class="muted"></p><div id="out"></div>`;
 const pre=new URLSearchParams(location.search).get('pitch');if(pre&&PITCHES.some(p=>p.id===pre))$('#p').value=pre;
 $('#p').onchange=render;$('#pv').onclick=()=>{DAY=addD(DAY,-1);render()};$('#nx').onclick=()=>{DAY=addD(DAY,1);render()};$('#td').onclick=()=>{DAY=dstr(new Date());render()};
 render()}
function login(){
 app.innerHTML=`<h2>Espace terrain</h2><input id="ph" type="tel" placeholder="+221 7X XXX XX XX"><button class="btn" id="s">Recevoir le code sur WhatsApp</button><div id="o"></div><p id="e" class="muted"></p>`;
 $('#s').onclick=async()=>{const phone=$('#ph').value.replace(/\s/g,'');
  const{error}=await sb.auth.signInWithOtp({phone,options:{channel:'whatsapp'}});if(error)return $('#e').textContent=error.message;
  $('#o').innerHTML='<input id="c" inputmode="numeric" placeholder="Code reçu"><button class="btn" id="v">Valider</button>';
  $('#v').onclick=async()=>{const{error}=await sb.auth.verifyOtp({phone,token:$('#c').value,type:'sms'});if(error)return $('#e').textContent=error.message;init()}}}

async function render(){
 const p=PITCHES.find(x=>x.id===$('#p').value);$('#pt').textContent=p.name;
 $('#dl').textContent=new Date(DAY+'T00:00:00Z').toLocaleDateString('fr-FR',{weekday:'long',day:'numeric',month:'long',timeZone:'UTC'});
 const ws=weekStart(DAY),oid=p.owner_id||'00000000-0000-0000-0000-000000000000';
 const[{data},{data:due},{data:po},{data:tot}]=await Promise.all([
  sb.from('bookings').select('code,starts_at,duration_hours,status,remaining_amount,owner_amount,profiles(first_name,last_name,phone)')
   .eq('pitch_id',p.id).gte('starts_at',ws+'T00:00:00Z').lt('starts_at',addD(ws,8)+'T00:00:00Z').in('status',['confirmee','terminee','paiement_en_attente']).order('starts_at'),
  sb.from('owner_balances_due').select('amount_due').eq('owner_id',oid),
  sb.from('payouts').select('amount,status,created_at').eq('owner_id',oid).order('created_at',{ascending:false}).limit(5),
  sb.from('bookings').select('starts_at,owner_amount,remaining_amount').eq('pitch_id',p.id).eq('status','terminee')]);
 const B=data||[],open=+p.opening_time.slice(0,2);let close=+p.closing_time.slice(0,2);if(close<=open)close+=24;const total=close-open;$('#nt').textContent=close>24?`Les heures après minuit (${hh(24)} à ${hh(close-1)}) font partie de la journée du terrain.`:'';
 const off=(b,s)=>(new Date(b.starts_at).getTime()-new Date(s+'T00:00:00Z').getTime())/36e5,onDay=s=>B.filter(b=>{const o=off(b,s);return o>=open&&o<close}),paidH=a=>a.filter(b=>b.status!=='paiement_en_attente').reduce((t,b)=>t+b.duration_hours,0);
 $('#wk').innerHTML=[...Array(7)].map((_,i)=>{const s=addD(ws,i),h=paidH(onDay(s)),d=new Date(s+'T00:00:00Z');
  return `<button class="dy${s===DAY?' on':''}${s===dstr(new Date())?' td':''}" data-d="${s}"><small>${d.toLocaleDateString('fr-FR',{weekday:'short',timeZone:'UTC'})}</small><b>${d.getUTCDate()}</b><span class="bar"><i style="width:${Math.min(100,Math.round(h/total*100))}%"></i></span><small>${h} h</small></button>`}).join('');
 document.querySelectorAll('[data-d]').forEach(b=>b.onclick=()=>{DAY=b.dataset.d;render()});
 const day=onDay(DAY),cov=new Set(),now=new Date();let tl='';
 day.forEach(b=>{const s=off(b,DAY);for(let k=0;k<b.duration_hours;k++)cov.add(s+k)});
 for(let h=open;h<close;h++){const r=h-open+1;tl+=`<div class="hl" style="grid-row:${r}">${hh(h)}</div>`;
  if(!cov.has(h)){const st=new Date(DAY+'T00:00:00Z');st.setUTCHours(h);const past=st.getTime()+36e5<=now.getTime();tl+=`<div class="fr${past?' ps':''}" style="grid-row:${r}">${past?'':'Libre'}</div>`}}
 day.forEach(b=>{const s=off(b,DAY),n=b.duration_hours,c=b.status==='paiement_en_attente'?'wt':b.status==='terminee'?'dn':'';
  tl+=`<div class="ev ${c}" style="grid-row:${s-open+1}/span ${n}"><b>${esc(b.profiles?.first_name)} ${esc(b.profiles?.last_name)}</b><span>${hh(s)} → ${hh(s+n)} · ${esc(b.code)}</span><span><a href="tel:${esc(b.profiles?.phone)}">${esc(b.profiles?.phone)}</a>${b.status==='paiement_en_attente'?' · paiement en cours':' · reste à encaisser '+fcfa(b.remaining_amount)}</span></div>`});
 const ok=day.filter(b=>b.status!=='paiement_en_attente'),net=b=>b.owner_amount+b.remaining_amount,done=day.filter(b=>b.status==='terminee').reduce((t,b)=>t+net(b),0),soon=day.filter(b=>b.status==='confirmee').reduce((t,b)=>t+net(b),0),h=paidH(day),T=tot||[],tn=a=>a.reduce((t,b)=>t+b.owner_amount+b.remaining_amount,0),mo=new Date().toISOString().slice(0,7);
 $('#out').innerHTML=`<div class="tl">${tl}</div>
 <div class="card"><b>Résumé de la journée</b><div class="kp" style="margin-top:10px"><div><small>Réservations</small><b>${ok.length}</b></div><div><small>Occupation</small><b>${Math.round(h/total*100)} %</b></div><div><small>Total encaissé</small><b>${fcfa(done)}</b><small>matchs terminés</small></div><div><small>À venir</small><b>${fcfa(soon)}</b><small>réservations confirmées</small></div></div></div>
 <div class="card"><b>Mes totaux</b><div class="kp" style="margin-top:10px"><div><small>Ce mois-ci</small><b>${fcfa(tn(T.filter(b=>b.starts_at.slice(0,7)===mo)))}</b></div><div><small>Depuis le début</small><b>${fcfa(tn(T))}</b><small>${T.length} match(s) joué(s)</small></div></div><p class="muted" style="margin-top:8px">Comprend ce que FootTime te reverse et ce que tu encaisses sur place.</p></div>
 <div class="card"><b>Reversements</b><p class="muted" style="margin:4px 0 8px">À recevoir : ${fcfa((due||[]).reduce((t,x)=>t+ +x.amount_due,0))}</p>
 ${(po||[]).map(x=>`<div class="row"><span>${new Date(x.created_at).toLocaleDateString('fr-FR')}</span><span>${fcfa(x.amount)} · ${esc(x.status)}</span></div>`).join('')||'<p class="muted">Aucun reversement pour le moment.</p>'}</div>`}
init();
</script></body></html>
