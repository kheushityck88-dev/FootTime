<!doctype html><html lang="fr"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#020C08"><link rel="manifest" href="manifest.json">
<link rel="icon" href="assets/icon-192.png"><link rel="apple-touch-icon" href="assets/icon-192.png"><title>FootTime</title>
<style>
:root{--g:#16A34A;--gd:#0F6B38;--k:#0B0F0E;--c:#F7F8F5;--gr:#9CA3AF}
*{box-sizing:border-box;margin:0}
body{font-family:system-ui,sans-serif;background:var(--c);color:var(--k);padding-bottom:72px}
header{background:var(--k);padding:10px 16px}header img{height:44px;display:block}
main{padding:16px;max-width:560px;margin:auto}h2{margin:4px 0 10px}
.card{background:#fff;border:1px solid #e5e7eb;border-radius:14px;margin-bottom:14px;overflow:hidden}
.card img{width:100%;height:150px;object-fit:cover;background:var(--k);display:block}.card>div{padding:12px}
.muted{color:var(--gr);font-size:14px}
.btn{background:var(--g);color:#fff;border:0;border-radius:10px;padding:14px;width:100%;font-size:16px;font-weight:600;margin-top:8px}
.btn.dk{background:var(--k)}.btn:disabled{background:var(--gr)}
.sl{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0}
.sl button{padding:10px 14px;border-radius:8px;border:1px solid var(--g);background:#fff;color:var(--gd);font-size:15px}
.sl button.on{background:var(--g);color:#fff}.sl button:disabled{border-color:#d1d5db;color:var(--gr);background:#f3f4f6}
input,select{width:100%;padding:12px;border:1px solid #d1d5db;border-radius:10px;margin:6px 0;font-size:16px;background:#fff}
nav{position:fixed;bottom:0;left:0;right:0;background:var(--k);display:flex;padding-bottom:env(safe-area-inset-bottom)}
nav button{flex:1;background:0;border:0;color:var(--gr);padding:16px 0;font-size:14px}nav button.on{color:var(--g);font-weight:700}
.tag{display:inline-block;padding:2px 8px;border-radius:99px;background:#dcfce7;color:var(--gd);font-size:12px}
.hero{background:var(--k);color:#fff;border-radius:14px;padding:22px;margin-bottom:14px}
.hero h1{font-size:28px;line-height:1.15}.hero span{color:var(--g)}
.hero p{color:var(--gr);margin-top:10px;letter-spacing:.18em;font-size:12px;text-transform:uppercase}
.loc{display:flex;align-items:center;gap:8px;color:var(--gd);font-weight:600;margin:4px 0}
.dot{width:9px;height:9px;border-radius:50%;background:var(--g)}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}.row{margin:10px 0}
.gal{display:flex;gap:8px;overflow-x:auto;scroll-snap-type:x mandatory;margin:12px 0}.gal img{height:200px;min-width:85%;object-fit:cover;border-radius:14px;scroll-snap-align:start;background:var(--k)}
label{display:block;margin-top:8px;font-size:14px;font-weight:600}
.steps{display:grid;gap:8px;margin-bottom:14px}.steps div{background:#fff;border:1px solid #e5e7eb;border-radius:12px;padding:12px;display:flex;gap:12px;align-items:center}
.steps b{background:var(--g);color:#fff;width:28px;height:28px;border-radius:50%;display:grid;place-items:center;flex:none}
.next{background:var(--k);color:#fff;border-radius:14px;padding:16px;margin-bottom:14px;display:grid;gap:4px}.next .muted{color:var(--gr)}
.pf{display:flex;gap:14px;align-items:center;margin-bottom:14px}.av{width:56px;height:56px;border-radius:50%;background:var(--g);color:#fff;display:grid;place-items:center;font-weight:700;font-size:20px;flex:none}
.kp{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:14px}.kp div{background:#fff;border:1px solid #e5e7eb;border-radius:12px;padding:12px;text-align:center}
.kp b{display:block;font-size:22px;color:var(--gd)}
.lk{display:block;background:#fff;border:1px solid #e5e7eb;border-radius:12px;padding:14px;margin-bottom:10px;color:var(--k);text-decoration:none;font-weight:600}
.hero2{background:var(--k);color:#fff;border-radius:18px;padding:22px 20px;margin-bottom:18px}
.hero2 h1{font-size:28px;line-height:1.18;margin:12px 0 10px}.hero2 h1 span{color:var(--g)}
.hero2 p{color:#cbd5d1;font-size:15px;line-height:1.5}
.badge{display:inline-flex;align-items:center;gap:8px;border:1px solid #26332d;padding:4px 12px;border-radius:99px;font-size:13px;color:#d1fae5}
.cta{display:grid;gap:10px;margin-top:16px}.cta .btn{margin-top:0}.btn.ghost{background:transparent;border:1.5px solid #fff;color:#fff}
.st{margin:24px 0 10px;font-size:18px;display:flex;align-items:center;gap:8px}.st:before{content:'';width:4px;height:18px;border-radius:2px;background:var(--g)}
.steps span{display:grid;gap:2px}.steps em{font-style:normal;color:#6b7280;font-size:14px;line-height:1.4}
.why{display:grid;gap:10px}.why div{background:#fff;border:1px solid #e5e7eb;border-radius:14px;padding:14px;display:grid;gap:4px}.why span{color:#6b7280;font-size:14px}
details{background:#fff;border:1px solid #e5e7eb;border-radius:12px;padding:12px 14px;margin-bottom:8px}summary{font-weight:600;cursor:pointer}
details p{margin-top:8px;color:#6b7280;font-size:14px;line-height:1.5}
.final{background:var(--k);color:#fff;border-radius:18px;padding:20px;margin:24px 0 4px;text-align:center}.final p{color:#cbd5d1;margin:8px 0 4px;font-size:14px}
#splash{position:fixed;inset:0;z-index:99;background:#020C08;display:flex;align-items:center;justify-content:center;flex-direction:column;transition:opacity .5s ease,visibility .5s}
#splash.out{opacity:0;visibility:hidden}
.sp{position:relative;overflow:hidden;width:min(74vw,330px)}
.sp img{width:100%;display:block;animation:pop .8s cubic-bezier(.2,.8,.2,1) both}
.sh{position:absolute;inset:0;background:linear-gradient(105deg,transparent 38%,rgba(255,255,255,.55) 50%,transparent 62%);mix-blend-mode:overlay;transform:translateX(-130%);animation:sw 1.1s .75s ease-out forwards}
.ld{width:120px;height:3px;border-radius:2px;background:#16251d;overflow:hidden;margin-top:34px}.ld i{display:block;height:100%;width:0;background:#16A34A;animation:ld 1.8s ease-in-out forwards}
@keyframes pop{from{opacity:0;transform:scale(.88)}to{opacity:1;transform:scale(1)}}
@keyframes sw{to{transform:translateX(130%)}}@keyframes ld{to{width:100%}}
@media(prefers-reduced-motion:reduce){.sp img,.sh,.ld i{animation:none}.ld i{width:100%}.sh{display:none}}
</style></head><body>
<div id="splash"><div class="sp"><img src="assets/logo-splash.png" alt="FootTime"><span class="sh"></span></div><div class="ld"><i></i></div></div>
<script>
(function(){var s=document.getElementById('splash');if(!s)return;
var force=/[?&]splash/.test(location.search),on=force||matchMedia('(display-mode: standalone)').matches||navigator.standalone===true;
try{if(!force&&sessionStorage.getItem('ftSplash'))on=false;sessionStorage.setItem('ftSplash','1')}catch(e){}
if(!on){s.remove();return}
setTimeout(function(){s.classList.add('out')},2000);setTimeout(function(){s.remove()},2600)})();
</script>

<header><img src="assets/logo.png" alt="FootTime"></header>
<main id="app"></main>
<nav><button data-v="home" class="on">Accueil</button><button data-v="res">Réservations</button><button data-v="me">Profil</button></nav>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="config.js"></script>
<script>
const sb=supabase.createClient(SUPABASE_URL,SUPABASE_ANON_KEY);
const $=s=>document.querySelector(s),app=$('#app');
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fcfa=n=>Number(n).toLocaleString('fr-FR')+' FCFA';
const hh=h=>String(h%24).padStart(2,'0')+'h';
const LB={paiement_en_attente:'Paiement en attente',confirmee:'Confirmée',terminee:'Terminée',annulee:'Annulée',expiree:'Expirée'};
let user=null;
function go(v){document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('on',b.dataset.v===v));({home,res:reservations,me:profile})[v]()}
document.querySelectorAll('nav button').forEach(b=>b.onclick=()=>go(b.dataset.v));

let PITCHES=[];
function freeHours(p,day,busy){
 const open=+p.opening_time.slice(0,2);let close=+p.closing_time.slice(0,2);if(close<=open)close+=24;const out=[];
 for(let h=open;h<close&&out.length<4;h++){const s=new Date(`${day}T00:00:00Z`);s.setUTCHours(h);const e=new Date(s.getTime()+36e5);
  if(s>new Date()&&!busy.some(x=>new Date(x.starts_at)<e&&new Date(x.ends_at)>s))out.push(h)}
 return out}
async function next(){
 const{data}=await sb.from('bookings').select('code,starts_at,duration_hours,remaining_amount,pitches(name)').eq('player_id',user.id).eq('status','confirmee').gt('starts_at',new Date().toISOString()).order('starts_at').limit(1);
 const b=data?.[0];if(!b)return;const s=new Date(b.starts_at),h=s.getUTCHours();
 $('#nx').innerHTML=`<div class="next"><span class="muted">Ton prochain match</span><b>${esc(b.pitches.name)}</b>
 <span>${s.toLocaleDateString('fr-FR',{weekday:'long',day:'numeric',month:'long',timeZone:'UTC'})} · ${hh(h)} → ${hh(h+b.duration_hours)}</span>
 <span class="muted">Code ${esc(b.code)} · reste à payer sur place : ${fcfa(b.remaining_amount)}</span>
 <button class="btn" onclick="go('res')">Voir mes réservations</button></div>`}
const IC=d=>`<svg viewBox="0 0 24 24" fill="none" stroke="#16A34A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" width="26" height="26">${d}</svg>`;
const STEPS=`<h3 class="st">Comment ça marche</h3><div class="steps">
<div><b>1</b><span><strong>Choisis ton terrain</strong><em>Photos, prix par heure, horaires, équipements et adresse : tout est sur la fiche du terrain.</em></span></div>
<div><b>2</b><span><strong>Choisis ta date et ton heure</strong><em>Les heures libres s'affichent en direct. Tu peux réserver plusieurs heures de suite.</em></span></div>
<div><b>3</b><span><strong>Paie une avance</strong><em>Avec Wave ou Orange Money. Le reste se paie directement sur place.</em></span></div>
<div><b>4</b><span><strong>Reçois ton code et joue</strong><em>Ta réservation est confirmée avec un code. Montre-le au gérant en arrivant.</em></span></div></div>`;
const WHY=`<h3 class="st">Pourquoi FootTime ?</h3><div class="why">
<div>${IC('<rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/>')}<b>Plus besoin d'appeler</b><span>Tu vois les créneaux libres directement, sans attendre une réponse.</span></div>
<div>${IC('<rect x="5" y="2" width="14" height="20" rx="2"/><path d="M12 18h.01"/>')}<b>Paiement simple</b><span>Wave ou Orange Money, depuis ton téléphone.</span></div>
<div>${IC('<path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/><path d="m9 12 2 2 4-4"/>')}<b>Réservation confirmée</b><span>Elle l'est dès que ton paiement est validé, avec un code à présenter sur place.</span></div></div>`;
const FAQ=`<h3 class="st">Questions fréquentes</h3>
<details><summary>Dois-je tout payer en ligne ?</summary><p>Non. Tu paies seulement une avance pour réserver. Le reste se règle sur place, au terrain.</p></details>
<details><summary>Puis-je annuler ?</summary><p>Oui, avec remboursement de l'avance dans les 5 heures qui suivent ta réservation, et jusqu'à 1 heure avant le match.</p></details>
<details><summary>Et si je ne peux plus venir à l'heure prévue ?</summary><p>Passé le délai d'annulation, tu peux changer la date ou l'heure jusqu'à 2 fois, sans remboursement.</p></details>
<details><summary>Comment je me connecte ?</summary><p>Avec ton numéro de téléphone : tu reçois un code de confirmation, il n'y a pas de mot de passe à retenir.</p></details>`;
async function home(){
 let first='';if(user){const{data:me}=await sb.from('profiles').select('first_name').eq('id',user.id).maybeSingle();first=me?.first_name||''}
 const out=!user;
 app.innerHTML=`<div class="hero2"><span class="badge"><span class="dot"></span>Kaolack</span>
 <h1>${first?`Salut ${esc(first)} !<br>`:''}Réserve ton terrain de foot <span>en quelques clics.</span></h1>
 <p>${out?"FootTime te montre les terrains de Kaolack, leurs prix et leurs heures libres. Tu choisis ton créneau, tu paies une petite avance avec Wave ou Orange Money, et ton terrain est réservé pour toi.":"Choisis ton terrain, vois les heures libres et réserve en quelques clics."}</p>
 <div class="cta"><button class="btn" onclick="document.getElementById('list').scrollIntoView({behavior:'smooth'})">Voir les terrains</button></div></div>
 <div id="nx"></div>${out?STEPS:''}
 <h3 class="st">Terrains à Kaolack</h3><input id="q" type="search" placeholder="Rechercher un terrain…"><div id="list"><p class="muted">Chargement…</p></div>
 ${out?WHY:''}${FAQ}
 ${out?`<div class="final"><b>Prêt à jouer ?</b><p>Crée ton compte avec ton numéro de téléphone et reçois un code de confirmation.</p><button class="btn" onclick="go('me')">Créer mon compte</button></div>`:''}`;
 if(user)next();
 const{data,error}=await sb.from('pitches').select('id,name,district,price_per_hour,opening_time,closing_time,pitch_photos(url,position),reviews(rating)').eq('is_active',true);
 if(error)return $('#list').innerHTML='<p>Chargement impossible.</p>';
 PITCHES=data;const today=new Date().toISOString().slice(0,10);
 await Promise.all(PITCHES.map(async p=>{const{data:b}=await sb.rpc('get_busy_slots',{p_pitch:p.id,p_day:today});p.free=freeHours(p,today,b||[])}));
 draw('');$('#q').oninput=e=>draw(e.target.value)}
function draw(q){
 q=q.trim().toLowerCase();const l=$('#list');l.innerHTML='';
 const r=PITCHES.filter(p=>(p.name+' '+(p.district||'')).toLowerCase().includes(q));
 if(!r.length){l.innerHTML=`<p class="muted">${PITCHES.length?'Aucun terrain trouvé.':'Les premiers terrains de Kaolack arrivent bientôt.'}</p>`;return}
 r.forEach(p=>{const ph=(p.pitch_photos||[]).sort((a,b)=>a.position-b.position)[0],n=(p.reviews||[]).length,
  avg=n?(p.reviews.reduce((t,x)=>t+x.rating,0)/n).toFixed(1):null;
  const d=document.createElement('div');d.className='card';d.style.cursor='pointer';
  d.innerHTML=`<img ${ph?`src="${esc(ph.url)}"`:''} alt=""><div><b>${esc(p.name)}</b> ${avg?`<span class="muted">★ ${avg} (${n} avis)</span>`:''}<br>
  <span class="muted">${esc(p.district)}</span><br><b>${fcfa(p.price_per_hour)}</b> / heure
  <div class="chips">${p.free.length?p.free.map(h=>`<span class="tag">${hh(h)}</span>`).join(''):'<span class="muted">Aucun créneau libre aujourd\'hui</span>'}</div></div>`;
  d.onclick=()=>pitch(p.id);l.appendChild(d)})}

async function pitch(id){
 const{data:p}=await sb.from('pitches').select('*,pitch_photos(url,position)').eq('id',id).single();
 const{data:st}=await sb.from('app_settings').select('value').eq('key','deposit_amount').maybeSingle();
 const{data:rv}=await sb.from('reviews').select('rating,comment').eq('pitch_id',id).eq('status','publie').order('created_at',{ascending:false}).limit(5);
 const AM={eclairage:'Éclairage',vestiaires:'Vestiaires',douches:'Douches',parking:'Parking'},eq=Object.keys(AM).filter(k=>(p.amenities||{})[k]).map(k=>AM[k]).join(' · ');
 const la=p.latitude,lo=p.longitude,map=la!=null&&lo!=null?`<iframe style="width:100%;height:200px;border:0;border-radius:14px;margin:10px 0" loading="lazy" src="https://www.openstreetmap.org/export/embed.html?bbox=${+lo-.004}%2C${+la-.003}%2C${+lo+.004}%2C${+la+.003}&layer=mapnik&marker=${la}%2C${lo}"></iframe><p><a href="https://www.google.com/maps?q=${la},${lo}" target="_blank" rel="noopener">Ouvrir dans Google Maps</a></p>`:'';
 const extras=`${eq?`<p style="margin-top:12px"><b>Équipements :</b> ${eq}</p>`:''}${p.rules?`<p><b>Règles :</b> ${esc(p.rules)}</p>`:''}${map}${rv?.length?'<h3 style="margin-top:12px">Avis</h3>'+rv.map(r=>`<p>★ ${r.rating}/5 ${esc(r.comment||'')}</p>`).join(''):''}`;
 const gal=(p.pitch_photos||[]).sort((a,b)=>a.position-b.position).map(x=>`<img src="${esc(x.url)}" alt="">`).join('');
 app.innerHTML=`<button class="btn dk" onclick="home()">← Retour</button>
 ${gal?`<div class="gal">${gal}</div>`:''}
 <h2>${esc(p.name)}</h2><p class="muted">${esc(p.address||p.district)}</p><p>${esc(p.description||'')}</p>
 <p><b>${fcfa(p.price_per_hour)}</b> / heure · ${p.opening_time.slice(0,5)}–${p.closing_time.slice(0,5)}</p>
 <label>Date</label><input type="date" id="d" min="${new Date().toISOString().slice(0,10)}">
 <label>Durée</label><select id="n">${[1,2,3,4].map(n=>`<option value="${n}">${n} h</option>`).join('')}</select>
 <div class="sl" id="sl"></div><p id="sum"></p>
 <label>Paiement de l'avance</label><select id="m"><option value="wave">Wave</option><option value="orange_money">Orange Money</option></select>
 <p class="muted" style="margin:8px 0">Annulation remboursable dans les 5 h suivant la réservation et jusqu'à 1 h avant le match. Passé ce délai : pas d'annulation, 2 changements de date ou d'heure possibles, sans remboursement.</p>
 <button class="btn" id="go" disabled>Réserver et payer l'avance</button><p id="msg" class="muted"></p>${extras}`;
 let sel=null;const msg=t=>$('#msg').textContent=t;
 async function slots(){
  const day=$('#d').value,n=+$('#n').value;sel=null;$('#go').disabled=true;$('#sum').textContent='';
  const sl=$('#sl');sl.innerHTML='';if(!day)return;
  const{data:busy}=await sb.rpc('get_busy_slots',{p_pitch:id,p_day:day});
  const open=+p.opening_time.slice(0,2);let close=+p.closing_time.slice(0,2);if(close<=open)close+=24;
  for(let h=open;h+n<=close;h++){
   const s=new Date(`${day}T00:00:00Z`);s.setUTCHours(h);const e=new Date(s.getTime()+n*36e5);
   const taken=s<=new Date()||(busy||[]).some(b=>new Date(b.starts_at)<e&&new Date(b.ends_at)>s);
   const b=document.createElement('button');b.textContent=hh(h);b.disabled=taken;
   b.onclick=()=>{sl.querySelectorAll('button').forEach(x=>x.classList.remove('on'));b.classList.add('on');sel=s;
    const tot=p.price_per_hour*n,dep=Math.min(+(st?.value||0),tot);
    $('#sum').innerHTML=`${hh(h)} → ${hh(h+n)} · Total <b>${fcfa(tot)}</b><br>Avance à payer : <b>${fcfa(dep)}</b> · Reste sur place : ${fcfa(tot-dep)}`;
    $('#go').disabled=false};
   sl.appendChild(b)}}
 $('#d').onchange=slots;$('#n').onchange=slots;
 $('#go').onclick=async()=>{
  if(!user)return msg("Connectez-vous dans l'onglet Profil pour réserver.");
  $('#go').disabled=true;msg('Réservation en cours…');
  const{data,error}=await sb.functions.invoke('create-booking',{body:{pitch_id:id,starts_at:sel.toISOString(),duration_hours:+$('#n').value,payment_method:$('#m').value}});
  if(error||!data?.checkout_url){let t='Erreur, réessayez.';try{t=(await error.context.json()).error||t}catch{}msg(t);$('#go').disabled=false;return}
  location.href=data.checkout_url}}

async function reservations(){
 if(!user)return app.innerHTML="<p>Connectez-vous dans l'onglet Profil.</p>";
 const{data}=await sb.from('bookings').select('id,code,starts_at,duration_hours,status,remaining_amount,modifications_count,pitch_id,pitches(name)').eq('player_id',user.id).order('starts_at',{ascending:false});
 app.innerHTML='<h2>Mes réservations</h2>'+(data?.length?'':'<p class="muted">Aucune réservation.</p>');
 (data||[]).forEach(b=>{const s=new Date(b.starts_at),h=s.getUTCHours();
  app.insertAdjacentHTML('beforeend',`<div class="card"><div><b>${esc(b.pitches.name)}</b> <span class="tag">${LB[b.status]}</span><br>
  ${s.toLocaleDateString('fr-FR',{weekday:'long',day:'numeric',month:'long',timeZone:'UTC'})} · ${hh(h)} → ${hh(h+b.duration_hours)}<br>
  Code ${esc(b.code)} · reste ${fcfa(b.remaining_amount)}<br><span class="muted">Changements restants : ${2-b.modifications_count}</span>
  ${b.status==='terminee'?`<button class="btn dk" onclick="rateB('${b.id}','${b.pitch_id}')">Noter ce terrain</button>`:''}${b.status==='confirmee'?`<button class="btn dk" onclick="cancelB('${b.id}')">Annuler</button><button class="btn" onclick="changeB('${b.id}')">Changer la date ou l'heure</button>`:''}</div></div>`)})}
const fail=e=>alert(e.code==='23P01'?'Ce créneau est déjà pris.':e.message);
async function cancelB(id){if(!confirm('Annuler cette réservation ?'))return;const{error}=await sb.rpc('cancel_booking',{p_booking:id});if(error)return fail(error);alert('Réservation annulée. Avance remboursable.');reservations()}
async function changeB(id){const d=prompt('Nouvelle date (AAAA-MM-JJ)'),h=d&&prompt("Nouvelle heure de début (0-23)");if(!d||h==null)return;
 const{error}=await sb.rpc('change_booking_time',{p_booking:id,p_new_start:`${d}T${String(h).padStart(2,'0')}:00:00Z`});if(error)return fail(error);alert('Créneau modifié.');reservations()}

async function rateB(id,pid){const r=+prompt('Note de 1 à 5');if(!(r>=1&&r<=5))return;const c=prompt('Commentaire (facultatif)')||null;
 const{error}=await sb.from('reviews').insert({player_id:user.id,pitch_id:pid,booking_id:id,rating:r,comment:c});
 if(error)return alert(error.code==='23505'?'Vous avez déjà noté cette réservation.':error.message);alert('Merci pour votre avis.')}

function loginForm(){
 app.innerHTML=`<h2>Connexion</h2><p class="muted" style="margin-bottom:8px">Entre ton numéro, tu reçois un code de confirmation.</p><input id="fn" placeholder="Prénom"><input id="ln" placeholder="Nom"><input id="ph" type="tel" placeholder="+221 7X XXX XX XX"><button class="btn" id="s">Recevoir le code sur WhatsApp</button><div id="o"></div><p id="e" class="muted"></p>`;
 $('#s').onclick=async()=>{const phone=$('#ph').value.replace(/\s/g,'');
  const{error}=await sb.auth.signInWithOtp({phone,options:{channel:'whatsapp',data:{first_name:$('#fn').value,last_name:$('#ln').value}}});
  if(error)return $('#e').textContent=error.message;
  $('#o').innerHTML='<input id="c" inputmode="numeric" placeholder="Code reçu"><button class="btn" id="v">Valider</button>';
  $('#v').onclick=async()=>{const{data,error}=await sb.auth.verifyOtp({phone,token:$('#c').value,type:'sms'});
   if(error)return $('#e').textContent=error.message;user=data.user;go('home')}}}
async function profile(){
 if(!user)return loginForm();
 const{data:p}=await sb.from('profiles').select('first_name,last_name,phone,role').eq('id',user.id).single();
 const{data:b}=await sb.from('bookings').select('status,starts_at').eq('player_id',user.id);
 const B=b||[],up=B.filter(x=>x.status==='confirmee'&&new Date(x.starts_at)>new Date()).length,pl=B.filter(x=>x.status==='terminee').length;
 const ini=((p.first_name||'?')[0]+(p.last_name||'')[0]).toUpperCase();
 const links=[...(['PROPRIETAIRE','GESTIONNAIRE','ADMIN_FOOTTIME'].includes(p.role)?[['owner.html','Mon espace terrain']]:[]),...(p.role==='ADMIN_FOOTTIME'?[['admin.html','Administration FootTime']]:[])];
 app.innerHTML=`<div class="pf"><div class="av">${esc(ini)}</div><div><h2>${esc(p.first_name)} ${esc(p.last_name)}</h2><span class="muted">${esc(p.phone)}</span></div></div>
 <div class="kp"><div><b>${up}</b><span class="muted">À venir</span></div><div><b>${pl}</b><span class="muted">Matchs joués</span></div><div><b>${B.length}</b><span class="muted">Réservations</span></div></div>
 <div class="card"><div><b>Mes informations</b><label>Prénom</label><input id="pf1" value="${esc(p.first_name)}"><label>Nom</label><input id="pf2" value="${esc(p.last_name)}"><button class="btn" id="sv">Enregistrer</button><p id="pm" class="muted"></p></div></div>
 <div class="card"><div><b>Règles de réservation</b><p class="muted" style="margin-top:6px">Annulation remboursable dans les 5 h suivant la réservation et jusqu'à 1 h avant le match. Ensuite : 2 changements de date ou d'heure possibles, sans remboursement.</p></div></div>
 ${links.map(([u,t])=>`<a class="lk" href="${u}">${t} →</a>`).join('')}<button class="btn dk" id="lo">Se déconnecter</button>`;
 $('#sv').onclick=async()=>{const{error}=await sb.from('profiles').update({first_name:$('#pf1').value.trim(),last_name:$('#pf2').value.trim()}).eq('id',user.id);
  $('#pm').textContent=error?error.message:'Informations enregistrées.'};
 $('#lo').onclick=async()=>{await sb.auth.signOut();user=null;go('home')}}

sb.auth.getSession().then(({data})=>{user=data.session?.user??null;home()});
if('serviceWorker'in navigator)navigator.serviceWorker.register('sw.js');
</script></body></html>
