<!doctype html><html lang="fr"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0B0F0E"><title>FootTime — Administration</title>
<style>
:root{--g:#16A34A;--gd:#0F6B38;--k:#0B0F0E;--c:#F7F8F5;--gr:#9CA3AF;--bd:#e5e7eb}
*{box-sizing:border-box;margin:0}
body{font-family:system-ui,sans-serif;background:var(--c);color:var(--k);padding-bottom:40px}
header{background:var(--k);padding:10px 16px;display:flex;align-items:center;gap:14px}header img{height:42px;display:block}header span{color:var(--gr);font-size:14px}
main{padding:16px;max-width:1000px;margin:auto}
.muted,small{color:#6b7280;font-size:13px}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:16px}
.tabs button{border:1px solid var(--bd);background:#fff;border-radius:10px;padding:10px 14px;font-size:15px;cursor:pointer}
.tabs button.on{background:var(--k);color:#fff;border-color:var(--k)}.tabs .out{margin-left:auto;color:#6b7280}
.st{margin:22px 0 10px;font-size:18px;display:flex;align-items:center;gap:8px}.st:before{content:'';width:4px;height:18px;border-radius:2px;background:var(--g)}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:12px}
.kpi{background:#fff;border:1px solid var(--bd);border-radius:14px;padding:16px;display:grid;gap:4px}
.kpi span{color:#6b7280;font-size:14px}.kpi b{font-size:26px;color:var(--gd)}.kpi small{font-size:12px}
.kpi.warn{border-color:#b45309}.kpi.warn b{color:#b45309}
.tw{overflow-x:auto;background:#fff;border:1px solid var(--bd);border-radius:14px}
table{width:100%;border-collapse:collapse;font-size:14px}th{text-align:left;font-size:12px;text-transform:uppercase;letter-spacing:.04em;color:#6b7280;padding:10px 12px;border-bottom:1px solid var(--bd)}
td{padding:10px 12px;border-bottom:1px solid #f0f1ef;vertical-align:top}tr:last-child td{border:0}
.chip{display:inline-block;padding:3px 10px;border-radius:99px;font-size:12px;font-weight:600;background:#eef0ee;color:#4b5563;white-space:nowrap}
.c-confirmee{background:#dcfce7;color:var(--gd)}.c-terminee{background:var(--k);color:#fff}.c-paiement_en_attente{background:#fef3c7;color:#92400e}
.pc{background:#fff;border:1px solid var(--bd);border-radius:14px;margin-bottom:12px;overflow:hidden}
.pc summary{list-style:none;display:flex;align-items:center;gap:12px;padding:12px 14px;cursor:pointer}.pc summary::-webkit-details-marker{display:none}
.th{width:56px;height:56px;border-radius:10px;background:var(--k);overflow:hidden;flex:none}.th img{width:100%;height:100%;object-fit:cover;display:block}
.ti{display:grid;gap:2px;flex:1}.ti small{font-size:13px}
.pb{padding:4px 16px 16px;border-top:1px solid var(--bd)}
.miss{background:#fef3c7;color:#92400e;border-radius:10px;padding:10px 12px;margin:12px 0;font-size:14px}
.grp{margin-top:16px}.grp h4{font-size:14px;color:var(--gd);margin-bottom:6px;text-transform:uppercase;letter-spacing:.05em}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:10px}@media(max-width:640px){.g2{grid-template-columns:1fr}}
label{display:block;margin-top:8px;font-size:13px;font-weight:600}
input,select{width:100%;padding:11px;border:1px solid #d1d5db;border-radius:10px;margin:5px 0;font-size:15px;background:#fff}
input[type=checkbox]{width:auto;margin:0 6px 0 0}
.am{display:flex;flex-wrap:wrap;gap:16px}.am label{display:flex;align-items:center;margin:0;font-weight:400}
.gal2{display:flex;gap:8px;flex-wrap:wrap;margin:6px 0}.gal2 span{position:relative}
.gal2 img{width:92px;height:92px;object-fit:cover;border-radius:10px}
.gal2 button{position:absolute;top:3px;right:3px;border:0;border-radius:99px;background:var(--k);color:#fff;width:22px;height:22px}
.btn{background:var(--g);color:#fff;border:0;border-radius:10px;padding:13px;width:100%;font-size:16px;font-weight:600;margin-top:12px}
.lk{display:inline-block;margin-top:12px;color:var(--gd);font-weight:600;text-decoration:none}
.tabs{position:sticky;top:0;z-index:5;background:var(--c);padding:10px 0;margin:-16px 0 14px;border-bottom:1px solid var(--bd)}
.kpi,.tile,.tw{box-shadow:0 1px 3px rgba(0,0,0,.05)}
.bar{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:14px;flex-wrap:wrap}.bar .btn{width:auto;margin:0;padding:11px 18px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:14px}
.tile{background:#fff;border:1px solid var(--bd);border-radius:16px;overflow:hidden}
.cover{height:150px;background:var(--k);position:relative;display:grid;place-items:center;color:var(--gr);font-size:13px}
.cover img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}.cover .chip{position:absolute;top:10px;left:10px}
.tb{padding:12px 14px;display:grid;gap:3px}.tb b{font-size:16px}
.acts{display:flex;gap:12px;align-items:center;margin-top:8px}.acts button{background:var(--k);color:#fff;border:0;border-radius:9px;padding:9px 14px;cursor:pointer;font-size:14px}.acts a{color:var(--gd);font-weight:600;font-size:14px;text-decoration:none}
.ov{position:fixed;inset:0;background:rgba(11,15,14,.6);z-index:20;display:flex;justify-content:center;align-items:flex-start;overflow-y:auto;padding:20px 12px}
.md{background:#fff;border-radius:18px;padding:20px;width:100%;max-width:640px}
.mh{display:flex;justify-content:space-between;align-items:center}.mh .x{border:0;background:#eef0ee;border-radius:99px;width:34px;height:34px;font-size:20px;cursor:pointer}
.g3{display:grid;grid-template-columns:2fr 1fr 1fr;gap:10px}@media(max-width:640px){.g3{grid-template-columns:1fr}}
.grp h4 em{font-style:normal;text-transform:none;letter-spacing:0;color:#6b7280;font-weight:400}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:6px}.opt{display:flex!important;align-items:center;border:1px solid var(--bd);border-radius:99px;padding:8px 14px;font-weight:400!important;margin:0!important;cursor:pointer}
.vis{display:flex!important;align-items:center;margin-top:18px!important;font-size:15px!important}
.mf{display:flex;gap:10px;justify-content:flex-end;align-items:center;margin-top:16px}.mf .btn{width:auto;margin:0;padding:12px 22px}
.ghost{background:#fff;border:1px solid var(--bd);border-radius:10px;padding:12px 18px;cursor:pointer}.del{margin-right:auto;background:none;border:0;color:#b45309;cursor:pointer}
</style></head><body>
<header><img src="assets/logo.png" alt="FootTime"><span>Administration</span></header><main id="app"></main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="config.js"></script>
<script>
const sb=supabase.createClient(SUPABASE_URL,SUPABASE_ANON_KEY),$=s=>document.querySelector(s),app=$('#app');
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fcfa=n=>Number(n||0).toLocaleString('fr-FR')+' FCFA',hh=h=>String(h%24).padStart(2,'0')+'h';
const AM={eclairage:'Éclairage',vestiaires:'Vestiaires',douches:'Douches',parking:'Parking'};
const ST={confirmee:'Confirmée',terminee:'Terminée',paiement_en_attente:'Paiement en attente',annulee:'Annulée',expiree:'Expirée'};
let D={},CUR='dash';

async function init(){
 const{data:{session}}=await sb.auth.getSession();if(!session)return login();
 const{data:me}=await sb.from('profiles').select('role').eq('id',session.user.id).single();
 if(me?.role!=='ADMIN_FOOTTIME')return app.innerHTML="<h2>Accès réservé</h2><p class='muted'>Ce compte n'est pas administrateur FootTime.</p>";
 load()}
function login(){
 app.innerHTML=`<div style="max-width:420px;margin:30px auto"><h2>Connexion administrateur</h2><input id="ph" type="tel" placeholder="+221 7X XXX XX XX"><button class="btn" id="s">Recevoir le code</button><div id="o"></div><p id="e" class="muted"></p></div>`;
 $('#s').onclick=async()=>{const phone=$('#ph').value.replace(/\s/g,'');
  const{error}=await sb.auth.signInWithOtp({phone,options:{channel:'whatsapp'}});if(error)return $('#e').textContent=error.message;
  $('#o').innerHTML='<input id="c" inputmode="numeric" placeholder="Code reçu"><button class="btn" id="v">Valider</button>';
  $('#v').onclick=async()=>{const{error}=await sb.auth.verifyOtp({phone,token:$('#c').value,type:'sms'});if(error)return $('#e').textContent=error.message;init()}}}

async function load(){
 const[pi,ow,bk,st,py,pl,du,ci]=await Promise.all([
  sb.from('pitches').select('*,pitch_photos(id,url,position)').order('created_at').order('id'),
  sb.from('owners').select('id,business_name,phone,user_id'),
  sb.from('bookings').select('code,starts_at,duration_hours,status,total_price,deposit_amount,pitches(name),profiles(first_name,last_name,phone)').order('created_at',{ascending:false}).limit(60),
  sb.from('bookings').select('status,commission_amount'),
  sb.from('payments').select('status,amount,needs_refund'),
  sb.from('profiles').select('id',{count:'exact',head:true}).eq('role','JOUEUR'),
  sb.from('owner_balances_due').select('amount_due'),
  sb.from('cities').select('id,name').order('name')]);
 if(pi.error)return app.innerHTML='<p>Chargement impossible.</p>';
 D={pitches:pi.data,owners:ow.data||[],bk:bk.data||[],st:st.data||[],pay:py.data||[],players:pl.count||0,due:du.data||[],cities:ci.data||[]};
 app.innerHTML=`<div class="tabs">${[['dash','Tableau de bord'],['pit','Terrains'],['res','Réservations'],['own','Propriétaires']].map(([k,t])=>`<button data-t="${k}">${t}</button>`).join('')}<button class="out" id="lo">Déconnexion</button></div><div id="pane"></div>`;
 app.querySelectorAll('[data-t]').forEach(b=>b.onclick=()=>tab(b.dataset.t));
 $('#lo').onclick=async()=>{await sb.auth.signOut();location.reload()};tab(CUR)}
function tab(k){CUR=k;app.querySelectorAll('[data-t]').forEach(b=>b.classList.toggle('on',b.dataset.t===k));({dash,pit:terrains,res:()=>{$('#pane').innerHTML='<h3 class="st">Réservations</h3>'+btable(60)},own:owners})[k]()}

function dash(){
 const B=D.st,ok=B.filter(b=>['confirmee','terminee'].includes(b.status)),n=s=>B.filter(b=>b.status===s).length;
 const paid=D.pay.filter(x=>x.status==='reussi'),sum=(a,f)=>a.reduce((t,x)=>t+(+f(x)||0),0),todo=paid.filter(x=>x.needs_refund).length;
 const k=(l,v,h,w)=>`<div class="kpi${w?' warn':''}"><span>${l}</span><b>${v}</b><small>${h}</small></div>`;
 $('#pane').innerHTML=`<div class="kpis">
 ${k('Joueurs inscrits',D.players,'Comptes joueurs')}
 ${k('Réservations',ok.length,`Confirmées ou terminées · ${n('annulee')} annulée(s) · ${n('expiree')} expirée(s)`)}
 ${k('Avances encaissées',fcfa(sum(paid,x=>x.amount)),'Paiements validés')}
 ${k('Commissions FootTime',fcfa(sum(ok,x=>x.commission_amount)),'Sur les réservations confirmées')}
 ${k('À reverser aux terrains',fcfa(sum(D.due,x=>x.amount_due)),'Matchs terminés, délai de reversement passé')}
 ${k('Remboursements à traiter',todo,todo?'Paiement reçu mais réservation non confirmée':'Rien à traiter',todo)}</div>
 <h3 class="st">Dernières réservations</h3>${btable(8)}`}
function btable(n){
 const r=D.bk.slice(0,n);if(!r.length)return '<p class="muted">Aucune réservation pour le moment.</p>';
 return `<div class="tw"><table><thead><tr><th>Code</th><th>Terrain</th><th>Joueur</th><th>Match</th><th>Montant</th><th>Statut</th></tr></thead><tbody>${r.map(b=>{const s=new Date(b.starts_at),h=s.getUTCHours();
 return `<tr><td><b>${esc(b.code)}</b></td><td>${esc(b.pitches?.name)}</td><td>${esc(b.profiles?.first_name)} ${esc(b.profiles?.last_name)}<br><small>${esc(b.profiles?.phone)}</small></td>
 <td>${s.toLocaleDateString('fr-FR',{day:'numeric',month:'short',timeZone:'UTC'})}<br><small>${hh(h)} → ${hh(h+b.duration_hours)}</small></td>
 <td>${fcfa(b.total_price)}<br><small>avance ${fcfa(b.deposit_amount)}</small></td><td><span class="chip c-${b.status}">${ST[b.status]}</span></td></tr>`}).join('')}</tbody></table></div>`}
function owners(){
 const o=D.owners;$('#pane').innerHTML='<h3 class="st">Propriétaires</h3>'+(o.length?`<div class="tw"><table><thead><tr><th>Nom</th><th>Téléphone</th><th>Terrains</th><th>Compte</th></tr></thead><tbody>${o.map(x=>`<tr><td><b>${esc(x.business_name)}</b></td><td>${esc(x.phone)}</td><td>${D.pitches.filter(p=>p.owner_id===x.id).map(p=>esc(p.name)).join(', ')||'—'}</td><td><span class="chip ${x.user_id?'c-confirmee':'c-paiement_en_attente'}">${x.user_id?'Relié':'En attente de connexion'}</span></td></tr>`).join('')}</tbody></table></div>`:"<p class='muted'>Aucun propriétaire. Ajoutes-en un depuis le bloc d'un terrain.</p>")}
function terrains(){
 $('#pane').innerHTML=`<div class="bar"><div><h3 class="st" style="margin:0">Terrains</h3><span class="muted">${D.pitches.filter(p=>p.is_active).length} visible(s) sur ${D.pitches.length}</span></div><button class="btn" id="add">+ Ajouter un terrain</button></div><div class="grid" id="pl"></div>`;
 $('#add').onclick=()=>edit(null);
 D.pitches.forEach(p=>{
  const ph=(p.pitch_photos||[]).sort((a,b)=>a.position-b.position)[0],draft=p.name.includes('(à renseigner)'),el=document.createElement('div');el.className='tile';
  el.innerHTML=`<div class="cover">${ph?`<img src="${esc(ph.url)}" alt="">`:'<span>Pas de photo</span>'}<span class="chip ${p.is_active?'c-confirmee':''}">${p.is_active?'Visible':'Brouillon'}</span></div>
  <div class="tb"><b>${draft?'Terrain à renseigner':esc(p.name)}</b><small>${esc(p.district||'Quartier non renseigné')}</small><small>${p.price_per_hour>1?fcfa(p.price_per_hour)+' / heure':'Prix non renseigné'}</small>
  <div class="acts"><button data-e>Modifier</button><a href="owner.html?pitch=${p.id}">Vue propriétaire</a></div></div>`;
  el.querySelector('[data-e]').onclick=()=>edit(p);$('#pl').appendChild(el)})}

function closeM(){document.querySelector('.ov')?.remove()}
function modal(html){closeM();const o=document.createElement('div');o.className='ov';o.innerHTML=`<div class="md">${html}</div>`;o.onclick=e=>{if(e.target===o)closeM()};document.body.appendChild(o);return o.querySelector('.md')}

function edit(p){
 if(!p){
  const m=modal(`<h3>Nouveau terrain</h3><p class="muted">Seulement l'essentiel. Tu ajouteras le reste ensuite, si ça existe.</p>
  <label>Nom du terrain</label><input class="nm">
  ${D.cities.length>1?`<label>Ville</label><select class="ci">${D.cities.map(c=>`<option value="${c.id}">${esc(c.name)}</option>`).join('')}</select>`:''}
  <div class="g3"><div><label>Prix par heure (FCFA)</label><input class="pr" type="number" min="1"></div><div><label>Ouverture</label><input class="op" type="time"></div><div><label>Fermeture</label><input class="cl" type="time"></div></div>
  <div class="mf"><button class="ghost" id="cn">Annuler</button><button class="btn" id="ok">Créer le terrain</button></div><p class="muted ms"></p>`);
  const q=s=>m.querySelector(s),ms=t=>q('.ms').textContent=t;q('#cn').onclick=closeM;
  q('#ok').onclick=async()=>{const name=q('.nm').value.trim(),price=+q('.pr').value,op=q('.op').value,cl=q('.cl').value,city=q('.ci')?.value||D.cities[0]?.id;
   if(!name||!(price>0)||!op||!cl)return ms('Le nom, le prix par heure et les horaires sont nécessaires.');
   if(!city)return ms("Aucune ville n'existe dans la base.");
   const{data,error}=await sb.from('pitches').insert({city_id:city,name,price_per_hour:price,opening_time:op,closing_time:cl,is_active:false,amenities:{}}).select('id').single();
   if(error)return ms(error.message);closeM();await load();edit(D.pitches.find(x=>x.id===data.id))};
  return}
 const ph=(p.pitch_photos||[]).sort((a,b)=>a.position-b.position),am=p.amenities||{},draft=p.name.includes('(à renseigner)');
 const m=modal(`<div class="mh"><h3>${draft?'Terrain à renseigner':esc(p.name)}</h3><button class="x" id="x">×</button></div>
 <div class="grp"><h4>L'essentiel <em>· obligatoire pour rendre visible</em></h4><label>Nom</label><input class="nm" value="${esc(draft?'':p.name)}">
  <div class="g3"><div><label>Prix par heure (FCFA)</label><input class="pr" type="number" min="1" value="${p.price_per_hour>1?p.price_per_hour:''}"></div><div><label>Ouverture</label><input class="op" type="time" value="${p.opening_time.slice(0,5)}"></div><div><label>Fermeture</label><input class="cl" type="time" value="${p.closing_time.slice(0,5)}"></div></div></div>
 <div class="grp"><h4>À ajouter si ça existe <em>· facultatif</em></h4>
  <div class="g2"><div><label>Quartier</label><input class="di" value="${esc(p.district)}"></div><div><label>Adresse</label><input class="ad" value="${esc(p.address)}"></div></div>
  <label>Localisation (coordonnées copiées depuis Google Maps)</label><input class="ll" placeholder="14.1520, -16.0720" value="${p.latitude!=null?p.latitude+', '+p.longitude:''}">
  <label>Description</label><input class="de" value="${esc(p.description)}"><label>Règles du terrain</label><input class="ru" value="${esc(p.rules)}">
  <label>Équipements disponibles</label><div class="chips">${Object.keys(AM).map(k=>`<label class="opt"><input type="checkbox" data-k="${k}" ${am[k]?'checked':''}>${AM[k]}</label>`).join('')}</div></div>
 <div class="grp"><h4>Propriétaire <em>· facultatif pour l'instant</em></h4><select class="ow"><option value="">— aucun —</option>${D.owners.map(o=>`<option value="${o.id}" ${o.id===p.owner_id?'selected':''}>${esc(o.business_name)} (${esc(o.phone)})</option>`).join('')}</select>
  <div class="g2"><input class="on" placeholder="Ou nouveau : nom"><input class="op2" type="tel" placeholder="Son téléphone"></div></div>
 <div class="grp"><h4>Photos <em>· facultatif</em></h4><div class="gal2">${ph.map(x=>`<span><img src="${esc(x.url)}" alt=""><button data-x="${x.id}">×</button></span>`).join('')}</div><input class="fl" type="file" accept="image/*" multiple></div>
 <label class="vis"><input type="checkbox" class="ac" ${p.is_active?'checked':''}>Visible dans l'appli</label>
 <div class="mf"><button class="del" id="dl">Supprimer</button><button class="ghost" id="cn">Fermer</button><button class="btn" id="sv">Enregistrer</button></div><p class="muted ms"></p>`);
 const q=s=>m.querySelector(s),ms=t=>q('.ms').textContent=t;
 q('#x').onclick=closeM;q('#cn').onclick=closeM;
 m.querySelectorAll('[data-x]').forEach(b=>b.onclick=async()=>{const{error}=await sb.from('pitch_photos').delete().eq('id',b.dataset.x);if(error)return ms(error.message);closeM();await load();edit(D.pitches.find(x=>x.id===p.id))});
 q('#dl').onclick=async()=>{if(!confirm('Supprimer définitivement ce terrain ?'))return;const{error}=await sb.from('pitches').delete().eq('id',p.id);
  if(error)return ms(error.code==='23503'?"Impossible : ce terrain a déjà des réservations. Décoche « Visible » pour le retirer de l'appli.":error.message);closeM();load()};
 q('#sv').onclick=async()=>{
  const name=q('.nm').value.trim(),price=+q('.pr').value,files=[...q('.fl').files],vis=q('.ac').checked;let owner=q('.ow').value;
  if(!name)return ms('Le nom est nécessaire.');
  if(vis&&!(price>0||p.price_per_hour>1))return ms('Pour rendre le terrain visible, il faut un prix par heure.');
  ms('Enregistrement…');
  if(q('.on').value.trim()){const{data:oid,error:eo}=await sb.rpc('add_owner',{p_name:q('.on').value.trim(),p_phone:q('.op2').value});if(eo)return ms(eo.message);owner=oid}
  const g=q('.ll').value.match(/(-?\d+(?:\.\d+)?)\s*[,; ]\s*(-?\d+(?:\.\d+)?)/);
  let pos=ph.length?Math.max(...ph.map(x=>x.position))+1:0;
  for(const f of files){const path=`${p.id}/${Date.now()}-${pos}-${f.name.replace(/[^\w.]/g,'_')}`;
   const{error:e1}=await sb.storage.from('pitch-photos').upload(path,f);if(e1)return ms(e1.message);
   const{data:u}=sb.storage.from('pitch-photos').getPublicUrl(path);
   const{error:e2}=await sb.from('pitch_photos').insert({pitch_id:p.id,url:u.publicUrl,position:pos++});if(e2)return ms(e2.message)}
  const amenities={};m.querySelectorAll('[data-k]').forEach(c=>amenities[c.dataset.k]=c.checked);
  const{error}=await sb.from('pitches').update({name,owner_id:owner||null,district:q('.di').value||null,address:q('.ad').value||null,
   latitude:g?+g[1]:null,longitude:g?+g[2]:null,description:q('.de').value||null,rules:q('.ru').value||null,
   price_per_hour:price>0?price:p.price_per_hour,opening_time:q('.op').value||p.opening_time,closing_time:q('.cl').value||p.closing_time,amenities,is_active:vis}).eq('id',p.id);
  if(error)return ms(error.message);
  closeM();await load();if(vis&&!owner)alert("Enregistré. Attention : aucun propriétaire n'est rattaché, aucun reversement n'est possible pour ce terrain.")};
}
init();
</script></body></html>
